# Push a tag named xbpretty-vX.Y.Z (X.Y.Z must equal version= in srcpkgs/xbpretty/template).
# The workflow gates tests/vet/freshness/lint, builds one .xbps per architecture, enforces
# the static/size/content/clean-root gates, signs an XBPS repository per architecture, and
# attaches the packages, signatures and repodata to the GitHub release, then commits the new
# checksum in srcpkgs/xbpretty/template. A missing XBPS_PRIVKEY fails the release.
name: release

on:
  push:
    tags: ["xbpretty-v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  GOFLAGS: "-trimpath -buildvcs=false"
  GOTOOLCHAIN: go1.25.5
  ARCHES: x86_64 x86_64-musl i686 aarch64 aarch64-musl armv7l armv7l-musl armv6l armv6l-musl
  MAX_BINARY_BYTES: "8000000"
  MAX_PACKAGE_BYTES: "3600000"

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/void-linux/void-glibc:latest
    steps:
      - name: Install build tools
        run: |
          xbps-install -Syu xbps
          xbps-install -Sy go bash make git shadow util-linux github-cli file binutils mdocml zsh fish-shell shellcheck python3
      - uses: actions/checkout@v4
      - name: Check tag against the template identity
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^version=//p' srcpkgs/xbpretty/template)
          revision=$(sed -n 's/^revision=//p' srcpkgs/xbpretty/template)
          [ -n "$version" ] || { echo "template has no version=" >&2; exit 1; }
          [ "$revision" = "1" ] || { echo "template revision must be 1, got $revision" >&2; exit 1; }
          [ "${GITHUB_REF_NAME}" = "xbpretty-v${version}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match template version ${version}" >&2; exit 1; }
          [ -f "docs/release-notes-${version}.md" ] || {
            echo "missing release notes docs/release-notes-${version}.md" >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "REVISION=${revision}" >> "$GITHUB_ENV"
      - name: Gate - actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/release.yml
      - name: Gate - mirror snapshot age
        run: |
          snapshot_date=$(sed -n 's/^const SnapshotDate = "\(.*\)"/\1/p' internal/fetch/snapshot.go)
          go run ./tools/snapshotage -date "$snapshot_date" -max-days 90
      - name: Create unprivileged builder
        run: |
          useradd -m builder
          mkdir -p "$RUNNER_TEMP/repo" "$RUNNER_TEMP/assets"
          chown -R builder "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repo"
      - name: Gate - go test and go vet
        run: |
          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && CGO_ENABLED=0 go test ./... -count=1 && go vet ./..."
      - name: Gate - completions, manpages, shell syntax, mandoc and shellcheck
        run: |
          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && RELEASE_STRICT=1 make release-check"
      - name: Build all nine architectures
        run: |
          # shellcheck disable=SC2086 # the architecture list is intentionally word-split
          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && tools/build-xbps.sh '$RUNNER_TEMP/repo' $ARCHES"
      - name: Collect release assets
        run: |
          cp "$RUNNER_TEMP"/repo/xbpretty-"${VERSION}"_"${REVISION}".*.xbps "$RUNNER_TEMP/assets/"
          tools/release-gates.sh package "$RUNNER_TEMP/assets/xbpretty-${VERSION}_${REVISION}.x86_64.xbps"
      - name: Gate - unsigned local-repo clean-root install and package contents
        run: |
          root="$RUNNER_TEMP/clean-root"
          mkdir -p "$root/var/db/xbps/keys"
          if ls /var/db/xbps/keys/*.plist >/dev/null 2>&1; then
            cp /var/db/xbps/keys/*.plist "$root/var/db/xbps/keys/"
          fi
          yes | env XBPS_ARCH=x86_64 xbps-install --rootdir="$root" -S -y \
            --repository="$RUNNER_TEMP/repo" \
            --repository="https://repo-default.voidlinux.org/current" \
            xbpretty
          tools/release-gates.sh binary "$root/usr/bin/xbpretty"
          tools/release-gates.sh installed "$root"
          version_line=$("$root/usr/bin/xbpretty" --version | head -n 1)
          [ "$version_line" = "xbpretty ${VERSION}" ] || {
            echo "clean-root --version = $version_line, want xbpretty ${VERSION}" >&2; exit 1; }
      - name: Sign each architecture
        env:
          XBPS_PRIVKEY: ${{ secrets.XBPS_PRIVKEY }}
        run: |
          # shellcheck disable=SC2086 # the architecture list is intentionally word-split
          tools/release-sign.sh "$RUNNER_TEMP/assets" "$VERSION" $ARCHES
          tools/release-gates.sh assets "$RUNNER_TEMP/assets" "$VERSION" "$REVISION"
      - name: Gate - signed HTTP repository clean-root install
        run: |
          root="$RUNNER_TEMP/signed-root"
          mkdir -p "$root/var/db/xbps/keys"
          if ls /var/db/xbps/keys/*.plist >/dev/null 2>&1; then
            cp /var/db/xbps/keys/*.plist "$root/var/db/xbps/keys/"
          fi
          python3 -m http.server 8765 --directory "$RUNNER_TEMP/assets" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          yes | env XBPS_ARCH=x86_64 xbps-install --rootdir="$root" -S -y \
            --repository="http://127.0.0.1:8765" \
            --repository="https://repo-default.voidlinux.org/current" \
            xbpretty
          tools/release-gates.sh binary "$root/usr/bin/xbpretty"
          tools/release-gates.sh installed "$root"
          version_line=$("$root/usr/bin/xbpretty" --version | head -n 1)
          [ "$version_line" = "xbpretty ${VERSION}" ] || {
            echo "signed clean-root --version = $version_line, want xbpretty ${VERSION}" >&2; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --title "xbpretty ${VERSION}" \
            --notes-file "docs/release-notes-${VERSION}.md" --generate-notes \
            "$RUNNER_TEMP"/assets/*

  template:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump template checksum
        run: |
          version=${GITHUB_REF_NAME#xbpretty-v}
          sum=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d' ' -f1)
          t=srcpkgs/xbpretty/template
          if grep -q "^version=${version}\$" "$t" && grep -q "^checksum=${sum}\$" "$t"; then
            echo "template already current"; exit 0
          fi
          sed -i "s/^version=.*/version=${version}/; s/^revision=.*/revision=1/; s/^checksum=.*/checksum=${sum}/" "$t"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Template: xbpretty ${version}"
          git push origin HEAD:main
